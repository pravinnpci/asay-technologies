services:
  asay-tech:
    build:
      context: .
      args:
        VITE_COMPANY_EMAIL: ${VITE_COMPANY_EMAIL}
        VITE_WEBSITE_WHATSAPP_NUMBER: ${VITE_WEBSITE_WHATSAPP_NUMBER}
        VITE_EMAILJS_SERVICE_ID: ${VITE_EMAILJS_SERVICE_ID}
        VITE_EMAILJS_TEMPLATE_ID: ${VITE_EMAILJS_TEMPLATE_ID}
        VITE_EMAILJS_PUBLIC_KEY: ${VITE_EMAILJS_PUBLIC_KEY}
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY}
        VITE_TWILIO_ACCOUNT_SID: ${VITE_TWILIO_ACCOUNT_SID}
        VITE_TWILIO_AUTH_TOKEN: ${VITE_TWILIO_AUTH_TOKEN}
        VITE_TWILIO_CONTENT_SID: ${VITE_TWILIO_CONTENT_SID}
    ports:
      - "3000:80"
    restart: always
    env_file:
      - .env